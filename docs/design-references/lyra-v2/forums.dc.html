<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;700;900&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
body { margin: 0; background: #06080f; font-family: "Space Grotesk", sans-serif; color: #E6EBF4;
  background-image: radial-gradient(1.5px 1.5px at 12% 22%, rgba(230,235,244,.7), transparent), radial-gradient(1px 1px at 68% 12%, rgba(139,92,246,.8), transparent), radial-gradient(1.5px 1.5px at 84% 58%, rgba(230,235,244,.5), transparent);
}
a { color: #E6EBF4; text-decoration: none; } a:hover { color: #ffffff; }
</style>
</helmet>
<div style="min-height: 100vh; display: flex; flex-direction: column;">
  <nav style="display: flex; align-items: center; gap: 28px; padding: 22px 48px; max-width: 1280px; margin: 0 auto; width: 100%; box-sizing: border-box;">
    <a href="Lyra Landing.dc.html" style="display: flex; align-items: center; gap: 12px;">
      <img src="https://d8j0ntlcm91z4.cloudfront.net/user_3H1v4G5Zwk3YKkFyyXJImybWvkx/hf_20260726_162659_808c9d52-3962-4abc-99ac-a83f75774d43.svg" alt="Lyra" style="width: 40px; height: 40px; border-radius: 10px;">
      <span style="font-family: 'Unbounded', sans-serif; font-weight: 900; font-size: 18px; letter-spacing: .04em;">LYRA</span>
    </a>
    <div style="margin-left: auto; display: flex; align-items: center; gap: 24px; font-size: 13px; font-weight: 500; letter-spacing: .1em;">
      <a href="Lyra Landing.dc.html">TRANG CHỦ</a>
      <a href="Lyra Play.dc.html">HƯỚNG DẪN</a>
      <a href="Lyra Store.dc.html">STORE</a>
      <a href="Lyra Login.dc.html" style="background: #8B5CF6; color: #fff; padding: 9px 20px; border-radius: 999px; font-weight: 700;">ĐĂNG NHẬP</a>
    </div>
  </nav>
  <main style="flex: 1; max-width: 1080px; margin: 0 auto; padding: 40px 48px 100px; width: 100%; box-sizing: border-box;">
    <div style="display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; flex-wrap: wrap; margin-bottom: 36px;">
      <div>
        <div style="font-size: 12px; color: #8B5CF6; font-weight: 700; letter-spacing: .3em; margin-bottom: 10px;">FORUMS</div>
        <h1 style="font-family: 'Unbounded', sans-serif; font-weight: 900; font-size: clamp(30px, 4.5vw, 42px); margin: 0;">Cộng đồng Lyra</h1>
      </div>
      <a href="Lyra Login.dc.html" style="background: #8B5CF6; color: #fff; padding: 12px 26px; border-radius: 12px; font-size: 13px; font-weight: 700; letter-spacing: .1em;" style-hover="filter: brightness(1.12);">+ TẠO CHỦ ĐỀ</a>
    </div>
    <div style="display: grid; grid-template-columns: 2fr 1fr; gap: 24px; align-items: start;">
      <div style="display: flex; flex-direction: column; gap: 14px;">
        <sc-for list="{{ categories }}" as="c" hint-placeholder-count="4">
          <div style="background: linear-gradient(180deg, rgba(16,16,22,.92), rgba(11,15,26,.92)); border: 1px solid #23232b; border-radius: 18px; padding: 22px 26px; display: flex; align-items: center; gap: 18px; transition: border-color .3s ease; cursor: pointer;" style-hover="border-color: rgba(139,92,246,.55);">
            <div style="width: 46px; height: 46px; border-radius: 12px; background: rgba(139,92,246,.12); border: 1px solid rgba(139,92,246,.3); display: flex; align-items: center; justify-content: center; font-size: 20px; color: #8B5CF6; font-weight: 700;">{{ c.icon }}</div>
            <div style="flex: 1;">
              <div style="font-weight: 700; font-size: 16px; margin-bottom: 3px;">{{ c.name }}</div>
              <div style="font-size: 12.5px; color: #9aa3b5;">{{ c.desc }}</div>
            </div>
            <div style="text-align: right;">
              <div style="font-family: 'Unbounded', sans-serif; font-weight: 700; font-size: 16px;">{{ c.threads }}</div>
              <div style="font-size: 10.5px; color: #626b7a; letter-spacing: .12em;">CHỦ ĐỀ</div>
            </div>
          </div>
        </sc-for>
      </div>
      <div style="display: flex; flex-direction: column; gap: 14px;">
        <div style="background: rgba(139,92,246,.08); border: 1px solid rgba(139,92,246,.35); border-radius: 18px; padding: 22px 24px;">
          <div style="font-size: 11px; color: #8B5CF6; font-weight: 700; letter-spacing: .24em; margin-bottom: 14px;">MỚI NHẤT</div>
          <div style="display: flex; flex-direction: column; gap: 14px;">
            <sc-for list="{{ recent }}" as="t" hint-placeholder-count="4">
              <div>
                <div style="font-size: 13.5px; font-weight: 500; color: #d5dbe8; line-height: 1.45; margin-bottom: 3px;">{{ t.title }}</div>
                <div style="font-size: 11px; color: #626b7a;">{{ t.by }} · {{ t.time }}</div>
              </div>
            </sc-for>
          </div>
        </div>
        <div style="background: rgba(16,16,22,.92); border: 1px solid #23232b; border-radius: 18px; padding: 22px 24px; text-align: center;">
          <div style="font-size: 12px; color: #9aa3b5; margin-bottom: 12px; line-height: 1.6;">Chat nhanh hơn? Cộng đồng chính của Lyra ở Discord.</div>
          <a href="#" style="display: inline-block; background: #5865F2; color: #fff; padding: 10px 26px; border-radius: 10px; font-size: 13px; font-weight: 700; letter-spacing: .08em;" style-hover="filter: brightness(1.1);">VÀO DISCORD</a>
        </div>
      </div>
    </div>
  </main>
  <footer style="border-top: 1px solid #1a1a22; padding: 26px 48px; display: flex; align-items: center; gap: 22px; max-width: 1280px; margin: 0 auto; width: 100%; box-sizing: border-box; font-size: 12px; color: #626b7a; letter-spacing: .08em; flex-wrap: wrap;">
    <img src="https://d8j0ntlcm91z4.cloudfront.net/user_3H1v4G5Zwk3YKkFyyXJImybWvkx/hf_20260726_162659_808c9d52-3962-4abc-99ac-a83f75774d43.svg" alt="" style="width: 24px; height: 24px; border-radius: 6px;">
    <span>LYRA NETWORK</span>
    <a href="Lyra Terms.dc.html" style="color: #626b7a;">ĐIỀU KHOẢN &amp; BẢO MẬT</a>
    <span style="margin-left: auto;">© 2026 Lyra</span>
  </footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals() {
    return {
      categories: [
        { icon: "✦", name: "Thông báo & Cập nhật", desc: "Tin chính thức từ đội ngũ Lyra", threads: "128" },
        { icon: "⌂", name: "Thảo luận chung", desc: "Mọi thứ về thiên hà Lyra", threads: "2.4K" },
        { icon: "◆", name: "Pixelmon & Cobblemon", desc: "Trade, đội hình, sự kiện gym", threads: "1.1K" },
        { icon: "⚑", name: "Báo lỗi & Hỗ trợ", desc: "Gặp vấn đề? Báo tại đây", threads: "356" },
        { icon: "✎", name: "Khoe công trình", desc: "Screenshot & timelapse build", threads: "890" }
      ],
      recent: [
        { title: "Sự kiện Vega Festival tháng 8 — thông tin chính thức", by: "AdminLyra", time: "12 phút" },
        { title: "Trade Charizard shiny lấy gì hợp lý?", by: "MinhKhoi_", time: "38 phút" },
        { title: "Timelapse castle 3 tháng ở Vanilla", by: "byNam", time: "2 giờ" },
        { title: "Góp þ: thêm warp chợ ở spawn Cobblemon", by: "linhh", time: "5 giờ" }
      ]
    };
  }
}
</script>
</body>
</html>
