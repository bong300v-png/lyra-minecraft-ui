<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;700;900&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
body { margin: 0; background: #06080f; font-family: "Space Grotesk", sans-serif; color: #E6EBF4; }
a { color: #E6EBF4; text-decoration: none; } a:hover { color: #ffffff; }
</style>
</helmet>
<div style="min-height: 100vh; display: flex; flex-direction: column;">
  <nav style="display: flex; align-items: center; gap: 28px; padding: 22px 48px; max-width: 1280px; margin: 0 auto; width: 100%; box-sizing: border-box;">
    <a href="Lyra Landing.dc.html" style="display: flex; align-items: center; gap: 12px;">
      <img src="https://d8j0ntlcm91z4.cloudfront.net/user_3H1v4G5Zwk3YKkFyyXJImybWvkx/hf_20260726_162659_808c9d52-3962-4abc-99ac-a83f75774d43.svg" alt="Lyra" style="width: 40px; height: 40px; border-radius: 10px;">
      <span style="font-family: 'Unbounded', sans-serif; font-weight: 900; font-size: 18px; letter-spacing: .04em;">LYRA</span>
    </a>
    <div style="margin-left: auto; display: flex; align-items: center; gap: 24px; font-size: 13px; font-weight: 500; letter-spacing: .1em;">
      <a href="Lyra Landing.dc.html">TRANG CHỦ</a>
      <a href="Lyra Vote.dc.html">VOTE</a>
      <a href="Lyra Store.dc.html">STORE</a>
      <a href="Lyra Forums.dc.html">FORUMS</a>
    </div>
  </nav>
  <main style="flex: 1; max-width: 860px; margin: 0 auto; padding: 40px 48px 100px; width: 100%; box-sizing: border-box;">
    <div style="font-size: 12px; color: #8B5CF6; font-weight: 700; letter-spacing: .3em; margin-bottom: 10px;">TIN TỨC & CẬP NHẬT</div>
    <h1 style="font-family: 'Unbounded', sans-serif; font-weight: 900; font-size: clamp(28px, 4vw, 40px); margin: 0 0 40px;">Nhật ký thiên hà</h1>
    <div style="display: flex; flex-direction: column; gap: 22px;">
      <sc-for list="{{ posts }}" as="p" hint-placeholder-count="4">
        <article style="background: linear-gradient(180deg, rgba(16,16,22,.92), rgba(11,15,26,.92)); border: 1px solid #23232b; border-radius: 18px; padding: 28px 30px; transition: border-color .3s ease;" style-hover="border-color: rgba(139,92,246,.5);">
          <div style="display: flex; align-items: center; gap: 12px; margin-bottom: 12px; flex-wrap: wrap;">
            <span style="font-size: 10.5px; font-weight: 700; letter-spacing: .18em; color: {{ p.tagColor }}; background: {{ p.tagBg }}; border: 1px solid {{ p.tagColor }}; border-radius: 999px; padding: 4px 12px;">{{ p.tag }}</span>
            <span style="font-size: 12px; color: #626b7a;">{{ p.date }}</span>
          </div>
          <h2 style="font-family: 'Unbounded', sans-serif; font-weight: 700; font-size: 19px; margin: 0 0 10px;">{{ p.title }}</h2>
          <p style="font-size: 14px; color: #9aa3b5; line-height: 1.7; margin: 0; text-wrap: pretty;">{{ p.body }}</p>
        </article>
      </sc-for>
    </div>
  </main>
  <footer style="border-top: 1px solid #1a1a22; padding: 26px 48px; display: flex; align-items: center; gap: 22px; max-width: 1280px; margin: 0 auto; width: 100%; box-sizing: border-box; font-size: 12px; color: #626b7a; letter-spacing: .08em; flex-wrap: wrap;">
    <img src="https://d8j0ntlcm91z4.cloudfront.net/user_3H1v4G5Zwk3YKkFyyXJImybWvkx/hf_20260726_162659_808c9d52-3962-4abc-99ac-a83f75774d43.svg" alt="" style="width: 24px; height: 24px; border-radius: 6px;">
    <span>LYRA NETWORK</span>
    <a href="Lyra Staff.dc.html" style="color: #626b7a;">ĐỘI NGŨ</a>
    <a href="Lyra Rules.dc.html" style="color: #626b7a;">NỘI QUY</a>
    <a href="Lyra Bans.dc.html" style="color: #626b7a;">BẢNG BAN</a>
    <span style="margin-left: auto;">© 2026 Lyra</span>
  </footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals() {
    const T = { update: ["#8B5CF6", "rgba(139,92,246,.1)"], event: ["#f0c96b", "rgba(240,201,107,.08)"], fix: ["#4ade80", "rgba(74,222,128,.08)"] };
    const mk = (tag, key) => ({ tag, tagColor: T[key][0], tagBg: T[key][1] });
    return {
      posts: [
        { ...mk("UPDATE", "update"), date: "24/07/2026", title: "Cobblemon Season 2 — Vùng đất Tinh Vân", body: "Map mới rộng gấp đôi với biome tinh vân phát sáng, 40 loài Cobblemon mới và hệ thống nest hiếm chỉ spawn ban đêm. Dữ liệu season 1 giữ nguyên, riêng bảng xếp hạng gym reset." },
        { ...mk("EVENT", "event"), date: "20/07/2026", title: "Double Vote Week — x2 mọi phần thưởng vote", body: "Từ 20 đến 27/07, mỗi vote nhận 2 Vote Key + 1.000 Xu. Vote đủ 5 site cả 7 ngày nhận trọn bộ 3 Vega Crate. Vote ngay tại trang Vote." },
        { ...mk("FIX", "fix"), date: "15/07/2026", title: "Vá lỗi dupe shulker và tối ưu TPS Vanilla", body: "Đã vá exploit dupe qua shulker + piston. TPS Vanilla giờ ổn định 19.8+ ở 1.200 người online nhờ chuyển farm chunk sang luồng riêng. Ai giữ đồ dupe sau 15/07 sẽ bị xử theo nội quy." },
        { ...mk("UPDATE", "update"), date: "08/07/2026", title: "Pixelmon thêm 25 gym leader do người chơi cầm", body: "Chương trình Gym Leader cộng đồng mở đơn: người chơi đạt top 100 ladder có thể ứng tuyển cầm gym với đội hình tự build. Huy hiệu gym mới hiển thị trên hồ sơ Forums." }
      ]
    };
  }
}
</script>
</body>
</html>
